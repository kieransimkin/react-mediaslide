name: Browser demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install demo-only tools without changing package lock
        run: npm install --no-save --package-lock=false vite@5 react-dom@18 @playwright/test@1.56
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx playwright test
      - name: Build GitHub Pages demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_PAGES: 'true'
        run: npx vite build --config demo/vite.config.mjs
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - name: Publish real browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaslide-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
