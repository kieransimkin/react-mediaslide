name: Publish MediaSlide
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: mediaslide-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source and tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      - name: Pack the tested output
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mediaslide-release
          path: release/
          if-no-files-found: error
  github:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mediaslide-release
      - run: sha256sum --check SHA256SUMS.txt
      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="react-mediaslide-${GITHUB_REF_NAME#v}.tgz"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern "$tarball" --pattern SHA256SUMS.txt --dir existing
            cmp "$tarball" "existing/$tarball"
            cmp SHA256SUMS.txt existing/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" "$tarball" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
  npm:
    needs: [pack, github]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mediaslide-release
          path: release
      - run: cd release && sha256sum --check SHA256SUMS.txt
      - name: Publish only if the version is absent
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/npm-release.cjs publish "$version" "release/react-mediaslide-$version.tgz"
  npm-verify:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mediaslide-release
          path: release
      - run: cd release && sha256sum --check SHA256SUMS.txt
      - name: Wait for the public npm registry and verify integrity
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/npm-release.cjs verify "$version" "release/react-mediaslide-$version.tgz"
