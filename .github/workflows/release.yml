name: Publish MediaSlide
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source and tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      - name: Pack the tested output
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mediaslide-release
          path: release/
          if-no-files-found: error
  github:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mediaslide-release
      - run: sha256sum --check SHA256SUMS.txt
      - name: Publish the verified tarball and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
  npm:
    needs: [pack, github]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mediaslide-release
      - run: sha256sum --check SHA256SUMS.txt
      - name: Publish and read back the same package
        run: |
          archive=$(find . -maxdepth 1 -name '*.tgz' -print)
          npm publish "$archive" --ignore-scripts --access public
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          for attempt in 1 2 3 4 5; do
            actual=$(npm view "react-mediaslide@${GITHUB_REF_NAME#v}" dist.integrity || true)
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 5
          done
          echo "The npm integrity did not match the published release tarball" >&2
          exit 1
